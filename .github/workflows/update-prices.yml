name: update-gold-prices

on:
  schedule:
    - cron: "*/30 * * * *"   # هر ۳۰ دقیقه
  workflow_dispatch:          # اجرای دستی از تب Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch prices
        env:
          NERKH_TOKEN: ${{ secrets.NERKH_TOKEN }}
        run: python3 scripts/fetch_prices.py

      - name: Commit if changed
        run: |
          git config user.name  "prices-bot"
          git config user.email "bot@users.noreply.github.com"
          git add prices.json
          git diff --staged --quiet || git commit -m "chore: update prices"
          git push
